<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Перенаправление…</title>
    <script>
      // SPA-фолбэк для GitHub Pages: сервер отдаёт 404.html для любого
      // неизвестного пути. Мы сохраняем исходный путь в query и уводим на
      // index.html, где index.html восстановит маршрут (см. скрипт в index.html).
      const segmentCount = 1; // 1 = проектный сайт (/<repo>/), 0 = сайт пользователя
      const l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(segmentCount)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
